name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "firebase_url": "https://ummah-daily.firebaseio.com",
              "project_id": "ummah-daily",
              "storage_bucket": "ummah-daily.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:1000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.ummahdaily.qmrkxt"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuild1234567890"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Build Debug APK
        run: gradle assembleDebug -x lint
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UMMAH-DAILY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
